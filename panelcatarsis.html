<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ede1cb;--card:#f8f2e6;--ink:#1f1b16;--teal:#6b5a45;--tint:#e3d4b8;--mut:#6f6558;--line:#d6c7aa;--red:#b8392b;--amb:#a05f00;--grn:#2c7a4b;--btn:#1f1b16;--btnink:#f8f2e6;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--card:#282420;--ink:#f1e7d3;--teal:#d2bb94;--tint:#3a3328;--mut:#a89d8c;--line:#443c30;--amb:#e0a84a;--grn:#5cc08a;--btn:#ede1cb;--btnink:#1f1b16;--onacc:#1d1a16}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;padding:20px 16px 40px;max-width:1100px;margin:auto;font-size:15px}
h1,h2,.cond{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0}
h1{font-size:clamp(28px,6.5vw,42px);line-height:1}
h2{font-size:clamp(24px,5vw,32px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub{color:var(--teal);font-size:23px;margin:10px 0 2px;font-weight:600}
.mut{color:var(--mut)}
.lbl{color:var(--mut);margin:20px 0 6px;font-size:14px}
button,input,select{font:inherit;color:var(--ink)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer}
.box{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:10px}
.who{background:var(--btn);color:var(--btnink);border-radius:20px;padding:12px 16px;margin-top:20px}
.who b{font:700 25px/1.1 'Barlow Condensed';display:block}
.who span{opacity:.8}
.branch{width:100%;border:0;border-radius:20px;background:var(--btn);color:var(--btnink);font:700 25px 'Barlow Condensed';padding:11px;margin:2px 0;cursor:pointer;opacity:.45}
.branch.on{opacity:1}
.ther{border:2px solid var(--line);background:var(--card);border-radius:22px;padding:11px 18px;text-align:center;cursor:pointer;margin:0 8px 8px 0;display:inline-block}
.ther.on{background:var(--tint);border-color:var(--teal)}
.ther b{display:block;font:700 23px/1.1 'Barlow Condensed'}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:18px}
.day{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 2px;text-align:center;cursor:pointer;font-size:12px;position:relative}
.day b{display:block;font:700 28px/1.1 'Barlow Condensed'}
.day.on{background:var(--teal);color:var(--onacc);border-color:var(--teal)}
.day input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1;min-width:0}
input,select,textarea{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;font-size:15px}
.f{display:block;font-size:12px;color:var(--mut);margin:0 0 3px 4px}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:14px;padding:10px 14px;font-size:15px;cursor:pointer;font-weight:500}
.btn.fit{flex:0 0 auto}
.x{flex:0 0 42px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--red);font-size:17px;cursor:pointer}
.srow{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin:8px 0}
.srow input:first-child{grid-column:1/-1}
.add{border:2px dashed var(--line);border-radius:28px;padding:12px;margin-top:16px}
.appt{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amb);border-radius:20px;padding:10px 12px;margin:8px 0}
.appt.s-confirmada{border-left-color:var(--grn)}
.appt.s-disponible{border-left-color:var(--teal);border-style:dashed;border-left-style:solid}
.appt .t{font:700 22px 'Barlow Condensed';min-width:54px}
.appt .i{flex:1;min-width:0}
.appt a{color:var(--teal)}
.ctl{flex-basis:100%;display:flex;gap:8px}
.ctl select{padding:7px 10px;border-radius:12px;font-size:13px}
.pg-pagado{color:var(--grn);font-weight:500}.pg-pendiente{color:var(--amb);font-weight:500}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{height:clamp(38px,9vw,54px);width:auto;flex:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
.chk{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;margin:0 6px 6px 0;background:var(--card)}.chk input{width:auto;margin:0}
.appt.s-bloqueado{border-left-color:var(--mut)}
.ctl{flex-wrap:wrap}.wab{text-decoration:none;font-size:13px;padding:7px 12px;color:var(--ink);white-space:nowrap}
h3.wkh{font:700 clamp(20px,5vw,24px) 'Barlow Condensed';margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gotow{position:relative;display:inline-block;flex:none}
.goto{font:500 13px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.pickhid{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;padding:0;margin:0;border:0}
.wk{display:flex;align-items:center;gap:6px}
.nav{flex:none;width:28px;height:48px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.dgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:0}
.dayb{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 0;text-align:center;cursor:pointer;opacity:.5;font:inherit;color:var(--ink)}
.dayb small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
.dayb b{display:block;font:700 22px/1.1 'Barlow Condensed'}
.dayb i{display:block;font-style:normal;font-size:10px;color:var(--mut);line-height:1;min-height:10px}
.dayb.has{background:var(--tint);opacity:1;border-color:transparent}
.dayb.on{background:var(--teal);color:var(--onacc);opacity:1;border-color:transparent}.dayb.on small,.dayb.on i{color:var(--onacc)}
.ro .x,.ro #edBtn,.ro .add,.ro #edit,.ro .wab{display:none!important}
.ro .ctl select{pointer-events:none;-webkit-appearance:none;appearance:none;background-image:none}
.sls{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin:10px 0}
.sl{border:1px solid var(--line);background:var(--tint);border-radius:10px;padding:9px 0;font:600 14px Barlow,sans-serif;cursor:pointer;color:var(--ink)}
.sl.blk{background:var(--btn);color:var(--btnink);text-decoration:line-through;border-color:var(--btn)}
.sl.busy{opacity:.4;cursor:default;background:transparent}
.sl:disabled{cursor:default}
.ro .nobox{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mhead h3{font:700 22px 'Barlow Condensed',sans-serif;margin:0}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.dnav b{font:700 20px 'Barlow Condensed',sans-serif;text-align:center}
.hide{display:none}
#login{display:none}
body.locked>*:not(#login){display:none!important}
body.locked #login{display:block}
.lbox{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 22px;text-align:center}
.lbox .logo{height:72px;margin-bottom:8px}.lbox input{margin:6px 0;text-align:left}
.err{color:var(--red);min-height:20px;font-size:14px;margin:6px 0}
.app{display:block}.side,.main{min-width:0}
@media(max-width:380px){.days{grid-template-columns:repeat(3,1fr)}.branch{font-size:21px}}
@media(min-width:600px){body{padding:28px 28px 48px}.row{gap:12px}}
@media(min-width:860px){.app{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start;margin-top:8px}.side{position:sticky;top:20px}.days{grid-template-columns:repeat(3,1fr)}.main h2{margin-top:22px!important}}
@media(min-width:1200px){body{max-width:1240px}.app{grid-template-columns:420px 1fr}}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style></head><body>
<div id="login"><form class="lbox" id="loginForm"><img class="logo" id="loginLogo" alt="Catarsis"><h2>Agenda Catarsis</h2><p class="mut" style="margin:6px 0 14px">Ingresa para ver tu agenda</p>
<input id="lEmail" type="email" placeholder="Correo" autocomplete="username" required aria-label="Correo">

    <div class="row"><div><label class="f">Desde</label><input type="time" data-h="desde" value="${S.cfg.horario.desde}"></div><div><label class="f">Hasta</label><input type="time" data-h="hasta" value="${S.cfg.horario.hasta}"></div></div>
    <div class="row"><div><label class="f">Intervalo entre horas (min)</label><input type="number" data-h="paso" min="10" step="5" value="${S.cfg.horario.paso}"></div><div><label class="f">Anticipación mínima (horas)</label><input type="number" data-h="adv" min="0" value="${S.cfg.horario.adv}"></div></div>
    <div class="mut" style="font-size:13px">Tus clientas ven libre todo este horario, excepto lo que tengas agendado o bloqueado aquí.</div>`;
  }
  const single=S.branches.length===1&&S.thers.length===1;
  who.innerHTML=single?`<div class="who"><b>${esc(S.branches[0])}</b><span>${esc(S.thers[0])} · ${ROL}</span></div>`:'';
  selbox.classList.toggle('hide',single);
  branches.innerHTML=S.branches.map((b,i)=>`<button class="branch ${i==S.branch?'on':''}" data-sb="${i}">${esc(b)}</button>`).join('');
  thers.innerHTML=S.thers.map((t,i)=>`<div class="ther ${i==S.ther?'on':''}" data-st="${i}"><b>${esc(t)}</b><span class="mut">${ROL}</span></div>`).join('');
  const cats=[...new Set(S.services.map(x=>x.c||'Otros'))],cc=cats.includes(cat.value)?cat.value:cats[0];
  cat.innerHTML=cats.map(c=>`<option ${c===cc?'selected':''}>${esc(c)}</option>`).join('');
  const prev=svc.value,first=!svc.options.length,gr={};
  S.services.forEach((x,i)=>{if((x.c||'Otros')!==cc)return;(gr[x.g||'']=gr[x.g||'']||[]).push(`<option value="${i}">${esc(x.n)} · ${x.m} min · ${money(x.v)}</option>`)});
  svc.innerHTML=Object.entries(gr).map(([g,o])=>g?`<optgroup label="${esc(g)}">${o.join('')}</optgroup>`:o.join('')).join('');
  if([...svc.options].some(o=>o.value===prev))svc.value=prev;else{svc.selectedIndex=0;fill()}
  if(first)fill();
  const L0=mine();
  const w1=new Date(wkS);w1.setDate(wkS.getDate()+6);
  let h=`<h3 class="wkh"><span>Semana del ${wkS.getDate()}${wkS.getMonth()!==w1.getMonth()?' de '+MES[wkS.getMonth()]:''} al ${w1.getDate()} de ${MES[w1.getMonth()]}</span><span class="gotow"><button type="button" class="goto" data-goto>📅 Ir a fecha</button><input type="date" id="pick" class="pickhid" tabindex="-1" aria-hidden="true"></span></h3><div class="wk"><button class="nav" data-wk="-1" aria-label="Semana anterior">‹</button><div class="dgrid">`;
  for(let i=0;i<7;i++){const d=new Date(wkS);d.setDate(wkS.getDate()+i);const s=iso(d),n=L0.filter(a=>a.d===s&&!a.bq).length,work=S.cfg.horario.dias.includes(d.getDay());
    h+=`<button class="dayb ${work?'has':''} ${s===sel?'on':''}" data-d="${s}" aria-pressed="${s===sel}"><small>${DS[d.getDay()]}</small><b>${d.getDate()}</b><i>${n?n+' hora'+(n==1?'':'s'):''}</i></button>`}
  h+=`</div><button class="nav" data-wk="1" aria-label="Semana siguiente">›</button></div>`;
  days.innerHTML=h;
  dayTitle.innerHTML=sel===iso(today)?`<span style="color:var(--teal)">Hoy</span>, ${fmtD(sel)}`:fmtD(sel);
  const L=L0.filter(a=>a.d===sel&&!a.bq).sort((a,b)=>a.t.localeCompare(b.t));
  const pend=L.filter(a=>!['disponible','bloqueado'].includes(a.e)&&a.p==='pendiente').length;
  dayInfo.textContent=L.length?`${L.length} hora${L.length==1?'':'s'} agendada${L.length==1?'':'s'}`+(pend?` · ${pend} abono${pend==1?'':'s'} pendiente${pend==1?'':'s'}`:''):'Sin horas agendadas.';
  list.innerHTML=L.map(a=>{const free=a.e==='disponible'||a.e==='bloqueado';return `<div class="appt s-${a.e}"><div class="t">${a.t}</div><div class="i"><b>${a.e==='bloqueado'?'Horario bloqueado':a.e==='disponible'?'Horario disponible':esc(a.c||'Sin nombre')}</b>${a.f&&!free?` · <a href="${wa(a.f)}" target="_blank" rel="noopener">${esc(a.f)}</a>`:''}<div class="mut">${esc(a.s)} · hasta ${end(a.t,a.m)} · ${money(a.v)}</div></div><button class="x" style="flex-basis:38px;height:38px" data-xa="${a.id}" aria-label="Quitar hora">✕</button><div class="ctl"><select data-e="${a.id}" aria-label="Estado">${opt([...(a.e==='disponible'?[['disponible','Disponible']]:[]),['bloqueado','Bloqueado'],['reservada','Reservada'],['confirmada','Confirmada']],a.e)}</select>${free?'':`<select class="pg-${a.p}" data-p="${a.id}" aria-label="Abono">${opt([['pendiente','Abono pendiente'],['pagado','Abono pagado']],a.p)}</select>`}${!free&&a.f?`<a class="pill wab" href="${waMsg(a)}" target="_blank" rel="noopener">Enviar comprobante</a>`:''}</div></div>`}).join('');
  slots.innerHTML=slotsHtml();blkDay.textContent=fmtD(sel);
  save();
}
document.addEventListener('click',e=>{
  const g=a=>e.target.closest('['+a+']');let el;
  if(e.target.id==='edBtn')editing=!editing;
  else if(el=g('data-sb'))S.branch=+el.dataset.sb;
  else if(el=g('data-st'))S.ther=+el.dataset.st;
  else if(el=g('data-d')){sel=el.dataset.d;custom=false}
  else if(el=g('data-blkopen')){blkModal.hidden=false;return}
  else if(el=g('data-blkclose')){blkModal.hidden=true;return}
  else if(e.target.id==='blkModal'){blkModal.hidden=true;return}
  else if(el=g('data-dayshift')){const d=new Date(sel+'T12:00');d.setDate(d.getDate()+ +el.dataset.dayshift);sel=iso(d);wkS=monOf(sel);custom=false}
  else if(el=g('data-sl'))toggleSlot(el.dataset.sl)
  else if(el=g('data-blkall'))blockAll(el.dataset.blkall==='1')
  else if(el=g('data-goto')){const i=document.getElementById('pick');try{i.showPicker()}catch(_){i.focus();i.click()}return}
  else if(el=g('data-wk')){const k=7*+el.dataset.wk,d=new Date(sel+'T12:00');d.setDate(d.getDate()+k);sel=iso(d);wkS.setDate(wkS.getDate()+k)}
  else if(el=g('data-xa'))S.appts=S.appts.filter(a=>a.id!=el.dataset.xa);
  else if(el=g('data-xb')){if(S.branches.length>1){S.branches.splice(+el.dataset.xb,1);S.branch=0}}
  else if(el=g('data-xt')){if(S.thers.length>1){S.thers.splice(+el.dataset.xt,1);S.ther=0}}
  else if(el=g('data-xs')){if(S.services.length>1){S.services.splice(+el.dataset.xs,1);svc.innerHTML=''}}
  else if(e.target.id==='at'){const v=nt.value.trim();if(v)S.thers.push(v)}
  else if(e.target.id==='ab'){const v=nb.value.trim();if(v)S.branches.push(v)}
  else if(e.target.id==='as'){S.services.push({n:'Nuevo servicio',m:60,v:0,c:'Masoterapia',g:'Otros'})}
  else if(e.target.id==='addAppt'){
    if(!time.value)return;const s=S.services[svc.value]||S.services[0];
    S.appts.push({id:Date.now(),k:key(),d:sel,t:time.value,m:+dur.value||s.m,c:client.value.trim(),f:phone.value.trim(),s:s.n,v:+price.value||0,e:estado.value,p:'pendiente'});
    client.value='';phone.value=''}
  else return;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')blkModal.hidden=true});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='pick'&&t.value){sel=t.value;custom=true;wkS=monOf(sel)}
  else if(t.id==='cat'){render();fill();return}
  else if(t.id==='svc'){fill();return}
  else if(d.b!==undefined){const o=S.branches[+d.b];S.branches[+d.b]=t.value;S.appts.forEach(a=>{const [b,r]=a.k.split('|');if(b===o)a.k=t.value+'|'+r})}
  else if(d.t!==undefined){const o=S.thers[+d.t];S.thers[+d.t]=t.value;S.appts.forEach(a=>{const [b,r]=a.k.split('|');if(r===o)a.k=b+'|'+t.value})}
  else if(d.sv!==undefined){S.services[+d.sv][d.f]=['n','c','g'].includes(d.f)?t.value:(+t.value||0);svc.innerHTML=''}
  else if(d.dia!==undefined){const v=+d.dia,a=S.cfg.horario.dias;S.cfg.horario.dias=t.checked?[...new Set([...a,v])]:a.filter(x=>x!==v)}
  else if(d.h!==undefined){S.cfg.horario[d.h]=(d.h==='paso'||d.h==='adv')?(+t.value||0):t.value}
  else if(d.c!==undefined){S.cfg[d.c]=d.c==='abono'||d.c==='plazo'?(+t.value||0):t.value}
  else if(d.e!==undefined){S.appts.find(a=>a.id==d.e).e=t.value}
  else if(d.p!==undefined){S.appts.find(a=>a.id==d.p).p=t.value}
  else return;
  render();
});
render();
initDB();
</script></body></html>
